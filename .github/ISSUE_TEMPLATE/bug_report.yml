name: Bug Report
description: Report a bug or unexpected behavior in SchemaPulse
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: SQL / Command / Steps to reproduce
      description: Include the exact command, config (if any), and sample SQL without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen vs. what actually happened?
    validations:
      required: true