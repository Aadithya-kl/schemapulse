name: Feature Request / New Rule
description: Propose a new safety rule, reporter, flag, or dialect adapter
labels: ["enhancement", "help wanted"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What migration risk, workflow gap, or developer pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired CLI behavior, rule ID/logic, or output format.
    validations:
      required: true